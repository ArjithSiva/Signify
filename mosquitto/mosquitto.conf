# Sample Mosquitto broker config for Signify.
# Copy this into your Mosquitto install (or pass with -c) and run:
#   mosquitto -c mosquitto.conf
#
# Two listeners:
#  - 1883: plain MQTT, used by the ESP32 and the Python backend scripts
#  - 9001: MQTT-over-WebSockets, used by the website (browsers can't
#          speak raw MQTT sockets, only WebSockets)
#
# No authentication is configured - fine for a local demo on a trusted
# LAN, but do NOT expose this broker to the open internet as-is. Add
# password_file / TLS before doing anything beyond a local demo.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
